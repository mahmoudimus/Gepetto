[project]
name = "gepetto"
version = "1.5.0"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.21.0",
    "google-genai>=1.36.0",
    "groq>=0.8.0",
    "ollama>=0.4.5",
    "openai>=1.101.0",
    "pytest>=8.4.2",
    "together>=1.2.0",
]

[dependency-groups]
dev = [
    "idapro>=0.0.6",
    "mypy>=1.11",
]

[tool.mypy]
python_version = "3.10"

# IDA's modules (ida_*, idaapi, idc) ship no stubs, and neither do several of
# the provider SDKs. Without this, every import is an error and the real ones
# drown in them.
ignore_missing_imports = true

# The whole package. A new module cannot quietly opt out of being checked.
files = ["gepetto"]

# Without this, mypy skips the bodies of functions that have no annotations,
# which in this codebase is most of them: it would be checking signatures more
# than code, and a name that does not exist inside an unannotated function
# would go unreported.
check_untyped_defs = true
